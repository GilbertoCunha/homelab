---
# The load balancer's address space, carved out of the guest bridge subnet.
# These are extra addresses that belong to Services rather than to machines,
# so they do not collide with the nodes at .11-.13 and .21-.23.
#
# See README.md for the guest address table, and docs/concepts/ingress.md for
# how an address here becomes reachable from the mesh.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: guest-bridge
spec:
  blocks:
    - start: 10.10.10.200
      stop: 10.10.10.250
