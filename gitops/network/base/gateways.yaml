---
# Reachable from the mesh at 10.10.10.200. See docs/concepts/ingress.md.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-internal-prod
  namespace: gateway-system
  annotations:
    # A record straight to 10.10.10.200, not proxied. The address is private,
    # so the name resolves for everyone and only a mesh device can route to it.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: internal-prod
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.k8s.homelab.grncunha.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-k8s-tls
      allowedRoutes:
        namespaces:
          # The isolation boundary. A namespace without this label cannot
          # attach a route here, and the API server is what enforces it.
          from: Selector
          selector:
            matchLabels:
              env: prod
    # Kept alongside HTTPS rather than redirecting to it. A route attaches to
    # both, so a curl by address and Host header still works when a certificate
    # is the thing being debugged.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.k8s.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: prod
---
# Reachable from the mesh at 10.10.10.201. Mesh only: there is no public dev
# zone and no dev tunnel, by design.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-internal-dev
  namespace: gateway-system
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: internal-dev
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.dev.k8s.homelab.grncunha.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-dev-k8s-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: dev
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.dev.k8s.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: dev
---
# Inert until cloudflared exists to dial it. Cloudflare terminates TLS at the
# edge and the tunnel carries its own, so this listener stays plain HTTP even
# once the public path is finished.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-public
  namespace: gateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: prod
