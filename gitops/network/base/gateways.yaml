---
# Reachable from the mesh at 10.10.10.200. See docs/concepts/ingress.md.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-internal-prod
  namespace: gateway-system
  labels:
    # Picks the external-dns instance that writes this Gateway's records.
    # `direct` is unproxied: an A record straight to 10.10.10.200. The address
    # is private, so the name resolves for everyone and only a mesh device can
    # route to it. See docs/concepts/ingress.md.
    dns-mode: direct
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: internal-prod
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.k8s.homelab.grncunha.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-k8s-tls
      allowedRoutes:
        namespaces:
          # The isolation boundary. A namespace without this label cannot
          # attach a route here, and the API server is what enforces it.
          from: Selector
          selector:
            matchLabels:
              env: prod
    # Kept alongside HTTPS rather than redirecting to it. A route attaches to
    # both, so a curl by address and Host header still works when a certificate
    # is the thing being debugged.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.k8s.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: prod
---
# Reachable from the mesh at 10.10.10.201. Mesh only: there is no public dev
# zone and no dev tunnel, by design.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-internal-dev
  namespace: gateway-system
  labels:
    dns-mode: direct
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: internal-dev
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.dev.k8s.homelab.grncunha.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-dev-k8s-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: dev
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.dev.k8s.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: dev
---
# Inert until cloudflared exists to dial it. Cloudflare terminates TLS at the
# edge and the tunnel carries its own, so this listener stays plain HTTP even
# once the public path is finished.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-public
  namespace: gateway-system
  labels:
    # `tunnel` proxies, which a .cfargotunnel.com CNAME needs to resolve at all.
    # This is the one place in the repo where an orange cloud is correct; see
    # docs/architecture/names.md.
    dns-mode: tunnel
  annotations:
    # The only external-dns annotation read from a Gateway. Every other one is
    # read from the HTTPRoute, which is why proxying is a label above rather
    # than an annotation here. See docs/concepts/ingress.md.
    external-dns.alpha.kubernetes.io/target: 0fe39bd7-3b36-4059-8151-9bc3c07ce0dd.cfargotunnel.com
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.homelab.grncunha.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              env: prod
