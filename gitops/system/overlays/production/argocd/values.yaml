---
# Values for the argo-cd chart.

# CRDs come from gitops/crds instead, because Helm does not upgrade them.
crds:
  install: false

configs:
  cm:
    # Used for ArgoCD generated links. The mesh zone, not the public one: the
    # anonymous read-only access below is meant for devices on the mesh, and
    # this name only resolves to an address a mesh device can route to.
    # It must match server.httproute.hostnames.
    url: https://argocd.k8s.homelab.grncunha.com

    # Without this ArgoCD cannot render a kustomization that inflates a Helm
    # chart -- which is exactly what it does to manage itself.
    kustomize.buildOptions: --enable-helm

    # No admin user
    admin.enabled: "false"

    # Read only access without login
    users.anonymous.enabled: "true"

    # Chart defaults, stated explicitly
    # To make syncs feel quicker use a GitHub webhook,
    # because it makes them event-driven.
    timeout.reconciliation: 120s
    timeout.reconciliation.jitter: 60s

  params:
    # The Gateway speaks plain HTTP to this Service. Left on its default the
    # server serves TLS and redirects, which turns into a redirect loop.
    server.insecure: true

    # Every Application applies server-side, so it must diff server-side too.
    # Without this the fields the Gateway API CRDs default -- parentRefs.kind,
    # backendRefs.weight, certificateRefs.group -- read as drift, and a synced
    # Gateway or HTTPRoute goes straight back to OutOfSync. The controller
    # reads this as an environment variable, so it restarts when it changes.
    controller.diff.server.side: "true"

  rbac:
    # Everyone starts read-only, including the anonymous user above.
    policy.default: role:readonly

server:
  # The chart owns this HTTPRoute, so the hostname is not written twice.
  # Attaching here is only permitted because the argocd namespace carries
  # `env: prod`; see gitops/system/base/argocd/namespace.yaml.
  httproute:
    enabled: true
    # A tile on the front page. These go on the route rather than in a list
    # Homepage keeps, and the chart templates the route, so they are set here
    # instead of on a hand-written copy of it.
    # See gitops/applications/base/homepage/.
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: ArgoCD
      gethomepage.dev/group: Cluster
      gethomepage.dev/description: What is deployed, and whether it is healthy
      gethomepage.dev/icon: argo-cd.png
      # Live counts on the tile: how many Applications there are, and how many
      # are synced, out of sync and healthy.
      #
      # No API key, and none is needed. Anonymous access is on with
      # `policy.default: role:readonly` above, and ArgoCD ignores a bearer
      # token it cannot parse rather than rejecting the request, so the
      # widget's empty `Authorization` header falls through to the anonymous
      # user. This grants the page nothing that anyone on the mesh could not
      # already read from the UI.
      #
      # The in-cluster Service, not the public hostname: Homepage calls this
      # from the pod, so it never leaves the cluster. Plain HTTP because
      # `server.insecure` is set above.
      gethomepage.dev/widget.type: argocd
      gethomepage.dev/widget.url: http://argocd-server.argocd.svc.cluster.local
    # No sectionName, so the route attaches to both the HTTPS and the HTTP
    # listener rather than only one of them.
    parentRefs:
      - name: gw-internal-prod
        namespace: gateway-system
    hostnames:
      - argocd.k8s.homelab.grncunha.com
