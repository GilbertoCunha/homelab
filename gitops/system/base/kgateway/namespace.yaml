# Separate from kgateway-system, which holds the controller: the controller is
# installed from a chart, the Gateways are written by hand.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: gateway-system
