---
# Two certificates, because wildcards do not nest: *.k8s.homelab.grncunha.com
# does not cover app.dev.k8s.homelab.grncunha.com.
#
# Only the mesh Gateways need one. Cloudflare terminates TLS for the public
# path, so gw-public has no certificate at all.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: wildcard-k8s
  namespace: gateway-system
spec:
  secretName: wildcard-k8s-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  # ECDSA, not the RSA default: a TLS handshake costs Envoy about a tenth of
  # the CPU, and clients connect by the thousand during a load test.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "*.k8s.homelab.grncunha.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: wildcard-dev-k8s
  namespace: gateway-system
spec:
  secretName: wildcard-dev-k8s-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  # ECDSA, not the RSA default: a TLS handshake costs Envoy about a tenth of
  # the CPU, and clients connect by the thousand during a load test.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "*.dev.k8s.homelab.grncunha.com"
