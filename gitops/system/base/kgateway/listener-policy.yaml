---
# Lets a client switch a connection to WebSocket through gw-internal-prod.
# Envoy refuses the switch unless it is named here, and answers `403` with an
# empty body: the request never reaches the workload.
#
# ntfy is the reason. The phone app holds one connection open to receive
# alerts, and WebSocket is the protocol it prefers; see
# docs/concepts/alerts.md. It applies to every route on the Gateway, so
# Grafana's live updates get it too.
#
# Only this Gateway. Nothing on the other two asks for it, and a policy
# attaches to one Gateway at a time.
#
# Wave 2, with the Gateway it attaches to.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: websocket
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-internal-prod
  upgradeConfig:
    enabledUpgrades:
      - websocket
