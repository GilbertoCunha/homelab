---
# What kind of Service kgateway gives each Gateway. This is the only place the
# Cilium load balancer and kgateway meet: kgateway provisions the Service, and
# Cilium fills in the address of any Service that asks to be a LoadBalancer.
# docs/concepts/ingress.md has the full path.
#
# Every Envoy runs on the worker, beside the applications it forwards to, so a
# request does not cross from one guest to another on its way in. Each selects
# the worker pool's label rather than the system pool's; see
# docs/concepts/node-pools.md.
#
# One replica each. A second on the same node survives nothing the first does
# not, and a rollout starts the new pod before it stops the old one.
#
# `--concurrency` is Envoy's number of worker threads, which is also the most
# CPUs it can use. Left unset it takes one per vCPU on the node, so three
# Gateways would each try to use the whole worker.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: internal-prod
  namespace: gateway-system
spec:
  kube:
    service:
      type: LoadBalancer
      # The address is announced only from a node running this Envoy; see
      # docs/concepts/ingress.md.
      externalTrafficPolicy: Local
    deployment:
      replicas: 1
    podTemplate:
      nodeSelector:
        homelab.grncunha.com/pool: worker
    # Sized from `kubectl top` on 2026-09-30: 22Mi per replica.
    envoyContainer:
      extraArgs:
        - --concurrency
        - "2"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    serviceOverlay:
      metadata:
        annotations:
          # Pinned. LB IPAM gives no ordering guarantee, so without this the
          # prod and dev Gateways could swap addresses across a rebuild and the
          # DNS records would quietly follow.
          lbipam.cilium.io/ips: "10.10.10.200"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: internal-dev
  namespace: gateway-system
spec:
  kube:
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
    deployment:
      replicas: 1
    podTemplate:
      nodeSelector:
        homelab.grncunha.com/pool: worker
    # Far more than prod's, because load tests run against dev. Envoy used 2.1
    # CPUs at 10,000 requests a second on 2026-10-01. The request is its share
    # of the worker when the applications want the same CPUs; four threads is
    # what the two replicas it replaces had between them.
    envoyContainer:
      extraArgs:
        - --concurrency
        - "4"
      resources:
        requests:
          cpu: "2"
          memory: 512Mi
    serviceOverlay:
      metadata:
        annotations:
          lbipam.cilium.io/ips: "10.10.10.201"
---
# No address from the pool. Nothing outside the cluster dials this Gateway
# directly: cloudflared reaches it over the cluster network, and Cloudflare
# reaches cloudflared over a tunnel it opens itself.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: public
  namespace: gateway-system
spec:
  kube:
    service:
      type: ClusterIP
    deployment:
      replicas: 1
    podTemplate:
      nodeSelector:
        homelab.grncunha.com/pool: worker
    # Sized from `kubectl top` on 2026-09-30: 20Mi per replica.
    envoyContainer:
      extraArgs:
        - --concurrency
        - "2"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
