---
# What kind of Service kgateway gives each Gateway. This is the only place the
# Cilium load balancer and kgateway meet: kgateway provisions the Service, and
# Cilium fills in the address of any Service that asks to be a LoadBalancer.
# docs/concepts/ingress.md has the full path.
# Every Envoy runs on the system nodes; see docs/concepts/node-pools.md. They
# are the way into the cluster, not an application.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: internal-prod
  namespace: gateway-system
spec:
  kube:
    service:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
    deployment:
      replicas: 2
    # Sized from `kubectl top` on 2026-09-30: 22Mi per replica.
    podTemplate:
      tolerations:
        - key: homelab.grncunha.com/pool
          operator: Equal
          value: system
          effect: NoSchedule
      nodeSelector:
        homelab.grncunha.com/pool: system
      # Two replicas on one node buy nothing: a node reboot takes both, and
      # the other system node's CPU goes unused. `pod-template-hash` spreads
      # a rollout's new pods among themselves, not around the old ones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: gw-internal-prod
          matchLabelKeys:
            - pod-template-hash
    envoyContainer:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    serviceOverlay:
      metadata:
        annotations:
          # Pinned. LB IPAM gives no ordering guarantee, so without this the
          # prod and dev Gateways could swap addresses across a rebuild and the
          # DNS records would quietly follow.
          lbipam.cilium.io/ips: "10.10.10.200"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: internal-dev
  namespace: gateway-system
spec:
  kube:
    service:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
    deployment:
      replicas: 2
    # Far more than prod's, because load tests run against dev. The CPU
    # request sets Envoy's share when a system node is saturated. Half a CPU
    # per replica leaves room in the system pool for everything else.
    podTemplate:
      tolerations:
        - key: homelab.grncunha.com/pool
          operator: Equal
          value: system
          effect: NoSchedule
      nodeSelector:
        homelab.grncunha.com/pool: system
      # Two replicas on one node buy nothing: a node reboot takes both, and
      # the other system node's CPU goes unused. `pod-template-hash` spreads
      # a rollout's new pods among themselves, not around the old ones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: gw-internal-dev
          matchLabelKeys:
            - pod-template-hash
    envoyContainer:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
    serviceOverlay:
      metadata:
        annotations:
          lbipam.cilium.io/ips: "10.10.10.201"
---
# No address from the pool. Nothing outside the cluster dials this Gateway
# directly: cloudflared reaches it over the cluster network, and Cloudflare
# reaches cloudflared over a tunnel it opens itself.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: public
  namespace: gateway-system
spec:
  kube:
    service:
      type: ClusterIP
    deployment:
      replicas: 2
    # Sized from `kubectl top` on 2026-09-30: 20Mi per replica.
    podTemplate:
      tolerations:
        - key: homelab.grncunha.com/pool
          operator: Equal
          value: system
          effect: NoSchedule
      nodeSelector:
        homelab.grncunha.com/pool: system
      # Two replicas on one node buy nothing: a node reboot takes both, and
      # the other system node's CPU goes unused. `pod-template-hash` spreads
      # a rollout's new pods among themselves, not around the old ones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: gw-public
          matchLabelKeys:
            - pod-template-hash
    envoyContainer:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
