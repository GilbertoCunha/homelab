# The GitHub App's credentials, encrypted, and committed. sops-secrets-operator
# decrypts it in the cluster and writes a Secret named github-app into the
# crossplane-system namespace, which the GitHub provider's
# ClusterProviderConfig reads.
#
# `credentials` is one JSON document: the owner, the App's ID, its
# installation's ID and its private key. The values here are placeholders.
# Filling them in is docs/manual/maintenance/connecting-crossplane-to-github.md.
