---
# How traffic gets into the cluster: the load balancer address pool, the L2
# announcement that makes those addresses answer, and the Gateways.
#
# Wave 2, after kgateway, because the GatewayParameters here are a kind
# kgateway's chart registers.
#
# spec.source.path and targetRevision are set per environment
# ../../overlays/production/applications/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/GilbertoCunha/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
