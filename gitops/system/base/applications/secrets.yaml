---
# The encrypted secrets that live in git. sops-secrets-operator turns each into
# a plain Secret; nothing here is readable without the age key.
#
# Wave 3, so the operator (0) and both namespaces these land in (cert-manager
# at 1, external-dns at 2) already exist. ArgoCD retries on its own if it gets
# there first, but not racing is cheaper than recovering from having raced.
#
# spec.source.path and targetRevision are set per environment
# ../../overlays/production/applications/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/GilbertoCunha/homelab
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
