# Grafana's admin login, encrypted, and committed. sops-secrets-operator
# decrypts it in the cluster and writes a Secret named grafana-admin into the
# grafana namespace, which the chart reads through `admin.existingSecret`.
#
# The key names are the chart's defaults, so nothing has to name them twice.
#
# Read it with:
#   task secrets:show:cluster -- gitops/system/base/grafana/admin-credentials.sops.yaml
# Change it with:
#   task secrets:edit:cluster -- gitops/system/base/grafana/admin-credentials.sops.yaml
#
# Wave 3, with every other SopsSecret. Grafana itself is wave 4 so the login
# exists before the pod that mounts it.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: grafana-admin
    namespace: grafana
    annotations:
        argocd.argoproj.io/sync-wave: "3"
spec:
    secretTemplates:
        - name: ENC[AES256_GCM,data:nv/S8n7R+OmPaP1ubw==,iv:yx2urhulSNRLHvJCGdqCtmHfQgKEfKl2lpWpj/JPHs0=,tag:Gpw0bTIgjGOyOoSMq9pF4w==,type:str]
          stringData:
            admin-user: ENC[AES256_GCM,data:T9kR+y0=,iv:rR9k94cpWcaq4ifCPG69bDuPXFMpRnlFFRSJEiiDWWI=,tag:2XjLZ0YnpvmAoKnCIzVSlg==,type:str]
            admin-password: ENC[AES256_GCM,data:2174tiUXHNx9fc1iO9lILHqOze7DmjWMYTQuLtosNag=,iv:P9Rz3mq5BgZR/nzB6OqjJJQSxan8NBmv4F2i6i4K+MU=,tag:3t5XEESMCeSDhwA1OaO7jw==,type:str]
sops:
