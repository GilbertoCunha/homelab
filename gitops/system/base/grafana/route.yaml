---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # A tile on the front page. Declared here rather than in a list Homepage
    # keeps, so exposing a service and cataloguing it are the same edit.
    # See gitops/applications/base/homepage/.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/group: Observability
    gethomepage.dev/description: Dashboards, metrics and logs
    gethomepage.dev/icon: grafana.png
    # Which pods back the tile's status dot. Without it Homepage looks for
    # `app.kubernetes.io/name` equal to the *route* name, and this route is
    # `grafana-ui` while the pods are `grafana`, so it finds nothing and the
    # tile reads "Not Found".
    gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
    # Needs no credentials: it asks VictoriaMetrics how many scrape targets are
    # up, over the Prometheus API it already serves.
    gethomepage.dev/widget.type: prometheus
    gethomepage.dev/widget.url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
  name: grafana-ui
  namespace: grafana
spec:
  parentRefs:
    - name: gw-internal-prod
      namespace: gateway-system
  hostnames:
    - grafana.k8s.homelab.grncunha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
