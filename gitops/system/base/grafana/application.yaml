---
# The dashboards. Grafana stores nothing itself worth keeping except what is
# clicked into it, which is exactly why it gets a volume.
#
# It claims a volume, so the storage class in wave 0 has to exist first; the
# wave below is later still, for the reason given there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    tier: system
  annotations:
    # Wave 4, not 1 with the rest: the admin login is a SopsSecret, and those
    # land in wave 3. Starting earlier only means the pod sits in
    # CreateContainerConfigError until the Secret shows up.
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 13.0.0
    # Inlined for the same reason as victoria-logs; see that application.yaml.
    helm:
      valuesObject:
        admin:
          # Written by sops-secrets-operator from admin-credentials.sops.yaml.
          # Left unset the chart generates a password into a Secret it owns,
          # which is then only discoverable by reading it out of the cluster.
          # `userKey` and `admin-user` / `passwordKey` and `admin-password` are
          # the chart's defaults, so the secret matches them rather than
          # overriding them here.
          existingSecret: grafana-admin

        plugins:
          # Reading logs needs a datasource plugin; the Prometheus one built in
          # cannot speak LogsQL. Signed and in the Grafana catalogue, so it
          # needs no `allow_loading_unsigned_plugins`. Installed from
          # grafana.com at pod start, into the volume below.
          #
          # `victorialogs-datasource` is the old id for this and no longer
          # exists. Any dashboard still asking for that one will not bind.
          - victoriametrics-logs-datasource

        podAnnotations:
          # Grafana exports its own metrics. The discovery job in
          # gitops/system/base/victoria-metrics/application.yaml scrapes
          # whatever carries these, so a component opts in beside itself.
          prometheus.io/scrape: "true"
          prometheus.io/port: "3000"

        sidecar:
          dashboards:
            # Watches every namespace for ConfigMaps carrying the label below
            # and loads them as dashboards. That is what lets a component ship
            # its own dashboard next to itself instead of every dashboard
            # having to be a gnetId listed here; Cilium's arrive this way.
            enabled: true
            label: grafana_dashboard
            searchNamespace: ALL

        persistence:
          # Off by default, which puts Grafana's database in an emptyDir and
          # loses every hand-made change on restart. No storageClassName:
          # local-path is the default class.
          enabled: true

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: victoriametrics
                type: prometheus
                orgId: 1
                # The service the victoria-metrics chart creates, named by
                # its fullnameOverride.
                url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
                access: proxy
                isDefault: true
                updateIntervalSeconds: 10
                editable: true

              - name: victorialogs
                # Logs, queried with LogsQL. Needs the plugin above; the type
                # is the plugin's id, not a Grafana built-in.
                type: victoriametrics-logs-datasource
                orgId: 1
                url: http://victoria-logs.victoria-logs.svc.cluster.local:9428
                access: proxy
                editable: true

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: "default"
                orgId: 1
                folder: ""
                type: file
                # Git decides what dashboards exist. Left true, Grafana keeps
                # every dashboard it has ever provisioned, and a dashboard
                # replaced in git fails to save for good: the old one holds the
                # internal id the new one is given, and Grafana logs
                # `deprecatedInternalID ... is already in use` and carries on
                # serving the stale copy.
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        # Pulled from grafana.com by id at pod start. Every one of these reads
        # metrics, so they all take the victoriametrics datasource; the logs
        # datasource above is for Explore and hand-built panels, because the
        # one published logs dashboard still asks for the dead plugin id.
        #
        # Cilium's dashboards are not here: its chart ships current ones, which
        # the sidecar picks up. See gitops/system/base/cilium/cilium.yaml.
        dashboards:
          default:
            # `revision` is not optional. Left out, the chart asks grafana.com
            # for revision 1 — the first version ever published, not the
            # current one — and you get a dashboard written for metric names
            # that were renamed years ago. Bump these deliberately.
            victoriametrics:
              gnetId: 10229
              revision: 58
              datasource: victoriametrics
            kubernetes:
              gnetId: 14205
              revision: 1
              datasource: victoriametrics
            victorialogs:
              # Needs victoria-logs to be scraped; it annotates itself for that.
              gnetId: 22084
              revision: 11
              datasource: victoriametrics
            kube-state-metrics:
              # Filters everything on a `cluster` label, which is why the
              # scrape config sets one.
              gnetId: 13332
              revision: 12
              datasource: victoriametrics
            cert-manager:
              gnetId: 11001
              revision: 1
              datasource: victoriametrics
            coredns:
              # Not 15762, the kubernetes-mixin one: it expects a metric set
              # that a plain CoreDNS install does not export, and fills a
              # fraction of its panels here.
              gnetId: 12539
              revision: 5
              datasource: victoriametrics
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true
      # Sync the app in part when resources are changed
      # only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true
    # No CreateNamespace: namespace.yaml declares it, because it carries
    # labels an implicitly created namespace would not have.
