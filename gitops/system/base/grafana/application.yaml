---
# The dashboards. Grafana stores nothing itself worth keeping except what is
# clicked into it, which is exactly why it gets a volume.
#
# It claims a volume, so the storage class in wave 0 has to exist first; the
# wave below is later still, for the reason given there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    tier: system
  annotations:
    # Wave 4, not 1 with the rest: the admin login is a SopsSecret, and those
    # land in wave 3. Starting earlier only means the pod sits in
    # CreateContainerConfigError until the Secret shows up.
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 13.0.0
    # Inlined for the same reason as victoria-logs; see that application.yaml.
    helm:
      valuesObject:
        admin:
          # Written by sops-secrets-operator from admin-credentials.sops.yaml.
          # Left unset the chart generates a password into a Secret it owns,
          # which is then only discoverable by reading it out of the cluster.
          # `userKey` and `admin-user` / `passwordKey` and `admin-password` are
          # the chart's defaults, so the secret matches them rather than
          # overriding them here.
          existingSecret: grafana-admin

        persistence:
          # Off by default, which puts Grafana's database in an emptyDir and
          # loses every hand-made change on restart. No storageClassName:
          # local-path is the default class.
          enabled: true

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: victoriametrics
                type: prometheus
                orgId: 1
                # The service the victoria-metrics chart creates, named by
                # its fullnameOverride.
                url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
                access: proxy
                isDefault: true
                updateIntervalSeconds: 10
                editable: true

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: "default"
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        dashboards:
          default:
            victoriametrics:
              gnetId: 10229
              datasource: victoriametrics
            kubernetes:
              gnetId: 14205
              datasource: victoriametrics
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true
      # Sync the app in part when resources are changed
      # only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true
    # No CreateNamespace: namespace.yaml declares it, because it carries
    # labels an implicitly created namespace would not have.
