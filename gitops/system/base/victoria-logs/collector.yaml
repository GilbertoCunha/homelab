---
# Reads every pod's logs off each node and ships them to the server above.
#
# Wave 1: the server it writes to is in the same wave, and the collector simply
# retries until that address answers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs-collector
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: victoria-logs
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: victoria-logs-collector
    repoURL: https://victoriametrics.github.io/helm-charts
    targetRevision: 0.3.7
    # Inlined for the same reason as the server's values; see application.yaml.
    helm:
      valuesObject:
        remoteWrite:
          # The service the chart above creates, named by its fullnameOverride.
          - url: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        collector:
          includePodLabels: true
          includePodAnnotations: false
          includeNodeLabels: false
          includeNodeAnnotations: false
          includeNamespaceLabels: true
          includeNamespaceAnnotations: false
          # Anything matching these never reaches storage.
          ignoreFields:
            - request.payload*
            - password
            - token
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true
      # Sync the app in part when resources are changed
      # only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
