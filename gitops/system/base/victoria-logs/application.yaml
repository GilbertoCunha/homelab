---
# Log storage. A single server, because one host's logs do not need a cluster.
#
# Wave 1: it claims a volume, so the storage class in wave 0 has to exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: victoria-logs
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: victoria-logs-single
    repoURL: https://victoriametrics.github.io/helm-charts
    targetRevision: 0.13.9
    # Values are inlined because the source is a Helm repository rather than
    # this one: ArgoCD resolves `valueFiles` inside the downloaded chart, so a
    # file kept here is silently never read.
    helm:
      valuesObject:
        server:
          # Without this the chart names everything after the release and the
          # chart both, giving `victoria-logs-victoria-logs-single-server`.
          fullnameOverride: victoria-logs
          # It exports its own metrics on the port below and nothing read them
          # until this was here. The discovery job in
          # gitops/system/base/victoria-metrics/application.yaml scrapes
          # whatever carries these; dashboard 22084 is what reads the result.
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9428"
          retentionPeriod: 7d
          persistentVolume:
            # No storageClassName anywhere: local-path is the default class.
            size: 10Gi
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true
      # Sync the app in part when resources are changed
      # only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true
    # No CreateNamespace: namespace.yaml declares it, because it carries
    # labels an implicitly created namespace would not have.
