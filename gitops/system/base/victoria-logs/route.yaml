---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # A tile on the front page; see gitops/applications/base/homepage/.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: VictoriaLogs
    gethomepage.dev/group: Observability
    gethomepage.dev/description: What every pod printed
    gethomepage.dev/icon: victoriametrics.png
    # Without this the tile links to the hostname's root, which serves a bare
    # index. The log search itself lives one path down, and the trailing slash
    # avoids a redirect.
    gethomepage.dev/href: https://victoria-logs.k8s.homelab.grncunha.com/select/vmui/
    # See the note on grafana's route: the route is `victoria-logs-ui`, the
    # pods are `victoria-logs-single`, and the guess from the route name misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/name=victoria-logs-single
  name: victoria-logs-ui
  namespace: victoria-logs
spec:
  parentRefs:
    - name: gw-internal-prod
      namespace: gateway-system
  hostnames:
    - victoria-logs.k8s.homelab.grncunha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: victoria-logs
          port: 9428
