---
# cloudflared's own config file. The tunnel is locally managed, so this is the
# routing table, not a copy of one in the dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  config.yaml: |
    tunnel: 0fe39bd7-3b36-4059-8151-9bc3c07ce0dd
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Idle connections to the Gateway that cloudflared keeps open for reuse.
    # At the default of 100, a load test on 2026-10-02 had it opening about
    # 800 a second to one address, which used up its local ports: requests
    # failed with 502, "cannot assign requested address".
    #
    # It has to be more than the requests ever in flight at once, or the rest
    # are opened and closed per request all the same. At 1000, a second test
    # that day passed it at 9,000 requests a second, and cloudflared spent 4
    # CPUs in the kernel opening connections. 8000 is above the 5,000
    # simulated users `peak.js` allows.
    originRequest:
      keepAliveConnections: 8000

    # One catch-all. The Gateway picks the HTTPRoute by Host, which cloudflared
    # preserves, so adding a public app is one more HTTPRoute and nothing here.
    ingress:
      - hostname: "*.grncunha.com"
        service: http://gw-public.gateway-system.svc:80
      - service: http_status:404
