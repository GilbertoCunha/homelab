---
# Dials gw-public from inside. Nothing new listens on the host; see
# docs/concepts/ingress.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # One, because there is one worker. A second on the same node survives
  # nothing the first does not.
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # On the worker, beside gw-public and the applications, so a public
      # request does not cross from one guest to another on its way in. It
      # selects the worker pool's label rather than the system pool's; see
      # docs/concepts/node-pools.md.
      nodeSelector:
        homelab.grncunha.com/pool: worker
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          # The most CPUs cloudflared can use, as `--concurrency` is for the
          # Gateways' Envoys. Left unset, Go takes one thread per vCPU on the
          # node, so it could take the whole worker.
          env:
            - name: GOMAXPROCS
              value: "4"
          # Sized from a load test on 2026-10-02, on the system node: 1.6 CPUs
          # and 127Mi at about 2,300 requests a second, which was all that
          # node's 2 vCPUs could give it. The request is its share of the
          # worker when the applications want the same CPUs.
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: credentials
          secret:
            secretName: cloudflared-credentials
