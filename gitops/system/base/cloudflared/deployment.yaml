---
# Dials gw-public from inside. Nothing new listens on the host; see
# docs/concepts/ingress.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # One, because there is one system node. A second on the same node survives
  # nothing the first does not.
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # On the system nodes; see docs/concepts/node-pools.md.
      tolerations:
        - key: homelab.grncunha.com/pool
          operator: Equal
          value: system
          effect: NoSchedule
      nodeSelector:
        homelab.grncunha.com/pool: system
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          # Sized from `kubectl top` on 2026-09-30: 16Mi. Without a request
          # the whole public path was BestEffort, first to go under pressure.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: credentials
          secret:
            secretName: cloudflared-credentials
