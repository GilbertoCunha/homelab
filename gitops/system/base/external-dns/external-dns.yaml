---
# Writes the DNS records for every HTTPRoute, so adding a service means adding
# a route and nothing else. See docs/concepts/ingress.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    namespace: external-dns
    server: https://kubernetes.default.svc
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.21.1
    helm:
      valuesObject:
        provider:
          name: cloudflare

        # Records follow the routes, rather than only ever being added. What
        # keeps that safe is ownership, below: external-dns will not delete a
        # record it does not own.
        policy: sync

        # This is the Cloudflare zone, and it has to be. The filter is matched
        # against zone names, not record names: a filter narrower than the zone
        # matches no zone at all, and external-dns then silently writes nothing.
        # The hand-made records for homelab, vpn.homelab and proxmox.homelab sit
        # in this zone, and are protected by ownership rather than by scope.
        domainFilters:
          - grncunha.com

        # Ownership is recorded in a TXT record carrying this id. Anything
        # without it -- the hand-made records above, and the _acme-challenge
        # records cert-manager creates -- is left alone.
        txtOwnerId: homelab-k8s

        sources:
          - gateway-httproute

        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
