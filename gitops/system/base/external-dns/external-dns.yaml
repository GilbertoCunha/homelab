---
# Writes the mesh DNS records: one for every HTTPRoute, so publishing an HTTP
# workload means adding a route and nothing else, and one for every
# LoadBalancer Service that asks for a name by annotation, which is how the
# non-HTTP workloads get one. See docs/concepts/ingress.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    namespace: external-dns
    server: https://kubernetes.default.svc
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.21.1
    helm:
      valuesObject:
        provider:
          name: cloudflare

        # Records follow the routes, rather than only ever being added. What
        # keeps that safe is ownership, below: external-dns will not delete a
        # record it does not own.
        policy: sync

        # This is the Cloudflare zone, and it has to be. The filter is matched
        # against zone names, not record names: a filter narrower than the zone
        # matches no zone at all, and external-dns then silently writes nothing.
        # The hand-made records for homelab, vpn.homelab and proxmox.homelab sit
        # in this zone, and are protected by ownership rather than by scope.
        domainFilters:
          - grncunha.com

        # Ownership is recorded in a TXT record carrying this id. Anything
        # without it -- the hand-made records above, and the _acme-challenge
        # records cert-manager creates -- is left alone.
        txtOwnerId: homelab-k8s

        sources:
          - gateway-httproute

          # For what an HTTPRoute cannot carry: anything that is not HTTP.
          # A Gateway listener is bound to one port and cannot dispatch raw TCP
          # by hostname, so a database or cache is exposed as its own
          # LoadBalancer Service with an address from the Cilium pool, and the
          # record follows that address. Opt-in per Service, by the hostname
          # annotation -- a Service without it is never written.
          # See docs/concepts/ingress.md.
          - service

        # Only the mesh Gateways. external-dns reads cloudflare-proxied from
        # the HTTPRoute and never from the Gateway, so proxying cannot be set
        # per Gateway by annotation. Splitting into two instances filtered by
        # this label is what sets it instead; external-dns-tunnel.yaml is the
        # other half. See docs/concepts/ingress.md.
        extraArgs:
          - --gateway-label-filter=dns-mode==direct

          # Applies to the service source only, and the gateway filter above
          # applies only to the gateway source, so the two do not overlap.
          # Without this a ClusterIP Service carrying the annotation would
          # resolve to an address reachable from nowhere outside the cluster.
          # Mesh addresses come from the Cilium pool, which only fills
          # status.loadBalancer on this type.
          - --service-type-filter=LoadBalancer

        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-dns-token
                key: api-token
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
