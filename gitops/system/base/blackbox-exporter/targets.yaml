---
# The list of hostnames to probe, built from the cluster's HTTPRoutes and served
# as JSON. VictoriaMetrics reads it with `http_sd_configs`; see the `uptime` job
# in gitops/system/base/victoria-metrics/application.yaml.
#
# This exists because nothing discovers an HTTPRoute for scraping. The
# Kubernetes discovery VictoriaMetrics and Prometheus share knows pods,
# Services and Ingresses, and no Gateway API kind. Without it, exposing a
# service would mean adding its hostname to a list as well, and the list would
# be what goes stale.
#
# Two annotations on a route change what is probed:
#
#   homelab.grncunha.com/probe: "false"       leaves the route out
#   homelab.grncunha.com/probe-path: /healthz probes that path, not `/`
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-targets
  namespace: blackbox-exporter
---
# Reads routes in every namespace, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: probe-targets
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: probe-targets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: probe-targets
subjects:
  - kind: ServiceAccount
    name: probe-targets
    namespace: blackbox-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-targets
  namespace: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-targets
  template:
    metadata:
      labels:
        app: probe-targets
    spec:
      serviceAccountName: probe-targets
      # On the system nodes; see docs/concepts/node-pools.md.
      tolerations:
        - key: homelab.grncunha.com/pool
          operator: Equal
          value: system
          effect: NoSchedule
      nodeSelector:
        homelab.grncunha.com/pool: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Lists the routes once a minute, and serves the list. One process, so
        # nothing is shared on disk.
        - name: probe-targets
          # Python and nothing else: the script below uses only what ships
          # with it. Deliberately not an image carrying kubectl, whose tag is a
          # Kubernetes version and would have to follow the cluster's. This
          # asks the API directly, so the image is independent of the cluster
          # and Renovate can move it freely.
          image: python:3.14.8-alpine
          # The script is written here rather than mounted from a ConfigMap, so
          # that changing it rolls the pod. Nothing restarts a pod when a
          # ConfigMap changes; see docs/backlog.md.
          #
          # -u: unbuffered, so a log line appears when it is printed.
          command: ["python", "-u", "-c"]
          args:
            - |
              import json, os, ssl, threading, time, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              # Where a pod finds its own credentials for the API.
              ACCOUNT = "/var/run/secrets/kubernetes.io/serviceaccount"
              API = "https://{}:{}/apis/gateway.networking.k8s.io/v1/httproutes".format(
                  os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"])
              ANNOTATION = "homelab.grncunha.com/"

              # None until the first listing succeeds. Answering 503 until then
              # keeps VictoriaMetrics from reading "no list yet" as "no routes".
              targets = None

              def discover():
                  # Read every time: Kubernetes replaces the token as it expires.
                  with open(ACCOUNT + "/token") as f:
                      token = f.read().strip()
                  context = ssl.create_default_context(cafile=ACCOUNT + "/ca.crt")
                  request = urllib.request.Request(API, headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(request, context=context, timeout=20) as response:
                      routes = json.load(response)["items"]
                  found = []
                  for route in routes:
                      metadata = route["metadata"]
                      annotations = metadata.get("annotations") or {}
                      if annotations.get(ANNOTATION + "probe") == "false":
                          continue
                      path = annotations.get(ANNOTATION + "probe-path", "/")
                      for hostname in route["spec"].get("hostnames") or []:
                          # A wildcard is not a name anything can be asked for.
                          if hostname.startswith("*"):
                              continue
                          found.append({
                              "targets": ["https://" + hostname + path],
                              "labels": {
                                  "hostname": hostname,
                                  "namespace": metadata["namespace"],
                                  "route": metadata["name"],
                              },
                          })
                  return json.dumps(found).encode()

              def refresh():
                  global targets
                  while True:
                      try:
                          targets = discover()
                      except Exception as error:
                          # The last good list stays in place.
                          print("Listing the routes failed. Serving the last list.", error)
                      time.sleep(60)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/targets.json":
                          self.send_error(404)
                      elif targets is None:
                          self.send_error(503, "No list yet")
                      else:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(targets)))
                          self.end_headers()
                          self.wfile.write(targets)

                  # One line per request, twice a minute, says nothing.
                  def log_message(self, *args):
                      pass

              threading.Thread(target=refresh, daemon=True).start()
              ThreadingHTTPServer(("", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          # Not ready until the first list exists.
          readinessProbe:
            httpGet:
              path: /targets.json
              port: http
            periodSeconds: 10
          # An estimate, not yet measured: an idle interpreter, and one request
          # to the API a minute.
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: probe-targets
  namespace: blackbox-exporter
spec:
  selector:
    app: probe-targets
  ports:
    - name: http
      port: 8080
      targetPort: http
