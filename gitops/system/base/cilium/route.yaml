---
# Hubble's UI, at hubble.k8s.homelab.grncunha.com. Cilium's chart creates the
# Service; this is the only thing needed to reach it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: gw-internal-prod
      namespace: gateway-system
  hostnames:
    - hubble.k8s.homelab.grncunha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
