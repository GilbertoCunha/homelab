---
# Cilium is the CNI, and it also replaces kube-proxy. This file is the only
# place its chart version and values are written: ArgoCD syncs it here, and
# `opentofu/project/cilium.tf` reads it to render the copy Talos creates at
# bootstrap. See [The cluster's networking](../../../../docs/concepts/cilium.md)
# for why it arrives twice.
#
# No sync wave. A wave orders things that must exist before other things, and
# nothing in this set can precede the CNI: it is already running before ArgoCD
# exists to sync anything at all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    tier: system
spec:
  project: default
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    # Move one minor version at a time, and read the upstream notes first:
    # https://docs.cilium.io/en/stable/operations/upgrade/
    targetRevision: 1.20.1
    helm:
      valuesObject:
        # Pod addresses come from the podCIDR Kubernetes gives each node, which
        # is carved out of `ipv4NativeRoutingCIDR` below. Cilium does not need
        # its own address management on top of that.
        ipam:
          mode: kubernetes

        kubeProxyReplacement: true

        # Pod traffic between nodes is routed as is, not wrapped in a VXLAN
        # tunnel. Every node is on the same guest bridge, so each can reach the
        # others' pod ranges directly, and `autoDirectNodeRoutes` installs those
        # routes. A tunnel adds a header and a trip through the kernel to every
        # packet, which a load test showed as half a system node's CPU.
        routingMode: native
        autoDirectNodeRoutes: true
        # The pod subnet. Traffic inside it keeps its pod addresses; anything
        # leaving it is masqueraded to the node's address. `cilium.tf` reads it
        # back from here for the machine configuration, so it is written once.
        ipv4NativeRoutingCIDR: 10.244.0.0/16

        # Masquerading in eBPF instead of iptables. This is also what switches
        # on eBPF host routing, where pod traffic skips the node's iptables and
        # routing stack. It breaks Talos' DNS forwarding to the host, which
        # `cluster.tf` turns off for that reason.
        bpf:
          masquerade: true

        # Direct server return. A load balancer address lives on one node, and
        # its backend is often on another. The backend's node then answers the
        # client directly instead of sending the reply back through the first
        # node, and the backend sees the caller's real address. The service
        # address travels to the backend in an IPv4 option, which the guest
        # bridge passes untouched. Requires native routing.
        loadBalancer:
          mode: dsr

        # Every value on this page reaches the agent through the `cilium-config`
        # ConfigMap, and the agent reads it once, at startup. The chart's default
        # is to leave the DaemonSet's pod template untouched when that ConfigMap
        # changes, so a values-only change syncs, reports Healthy, and never
        # reaches a running agent. A version bump hides this by changing the
        # image, which rolls the pods for its own reasons.
        #
        # These render a checksum of the ConfigMap onto the pod templates, so a
        # changed value rolls the agents node by node and the operator with them.
        # It makes editing this file mean what it looks like it means.
        rollOutCiliumPods: true
        operator:
          rollOutPods: true

        # Lets a Service of `type: LoadBalancer` get a real address: LB IPAM
        # picks one out of a CiliumLoadBalancerIPPool, and one agent wins a
        # lease and answers ARP for it on the guest bridge. There is no
        # appliance and no BGP here, so without this a LoadBalancer Service
        # stays <pending> forever. `docs/concepts/ingress.md` has the whole path.
        l2announcements:
          enabled: true

        # L2 leases are renewed constantly. The chart's default client rate
        # limit is too low for that and the agent starts logging throttle
        # warnings.
        k8sClientRateLimit:
          qps: 20
          burst: 100

        # Replacing kube-proxy means Cilium cannot reach the API server through
        # a Service, because Services are the thing it has not set up yet.
        # KubePrism is the local proxy Talos runs for exactly this bootstrap
        # problem. `opentofu/project/cluster.tf` reads the port back from here
        # to pin it in the machine configuration, so it is written once.
        k8sServiceHost: localhost
        k8sServicePort: 7445

        # Talos mounts the cgroup filesystem itself and gives out capabilities
        # rather than blanket privilege, so the chart's defaults do not apply.
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE

        # Off by default, so until this the CNI carrying every packet in the
        # cluster reported nothing. Enabling it annotates the agent DaemonSet
        # for scraping, which is all the discovery job in
        # gitops/system/base/victoria-metrics/application.yaml needs. The
        # operator is annotated by the chart already.
        prometheus:
          enabled: true

        # The chart ships dashboards written for this exact version, as
        # ConfigMaps labelled `grafana_dashboard`. Grafana's sidecar collects
        # them, which is why none of these are a gnetId in
        # gitops/system/base/grafana/application.yaml: grafana.com's Cilium
        # dashboards are still written for 1.12.
        dashboards:
          enabled: true

        hubble:
          # Requests sized from `kubectl top` on 2026-09-30: relay 15Mi, the
          # UI's backend 40m and 106Mi. The agent and operator keep the chart's
          # own settings; they run the network and are left alone.
          relay:
            enabled: true
            # On the system nodes; see docs/concepts/node-pools.md.
            tolerations:
              - key: homelab.grncunha.com/pool
                operator: Equal
                value: system
                effect: NoSchedule
            nodeSelector:
              homelab.grncunha.com/pool: system
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
          ui:
            enabled: true
            # On the system nodes; see docs/concepts/node-pools.md.
            tolerations:
              - key: homelab.grncunha.com/pool
                operator: Equal
                value: system
                effect: NoSchedule
            nodeSelector:
              homelab.grncunha.com/pool: system
            backend:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
            frontend:
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
          # Certificates are minted in the cluster by a job. The chart's default
          # is to mint them while rendering, which would put a fresh private key
          # in the machine configuration on every plan: a secret in the state
          # and a change to apply every single run.
          tls:
            auto:
              enabled: true
              method: cronJob
          # Hubble sees every flow but stores none of it. These turn a chosen
          # few into counters worth keeping: what was dropped and why, DNS
          # answers, TCP state. Left empty, Hubble is only ever a live view.
          #
          # Each one costs cardinality, so this is a deliberate short list
          # rather than everything the chart offers.
          metrics:
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - port-distribution
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Talos created these objects with its own field manager. A server-side
      # apply is what lets ArgoCD take the fields over rather than conflict.
      - ServerSideApply=true
