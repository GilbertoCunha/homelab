---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics-write
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: gw-internal-prod
      namespace: gateway-system
  hostnames:
    - victoria-metrics.k8s.homelab.grncunha.com
  rules:
    - matches:
        - path:
            # Only allow write metrics from outside the cluster
            # Useful for running local k6 tests from within
            # the mesh network
            type: Exact
            value: /api/v1/write
      backendRefs:
        - name: victoria-metrics
          port: 8428
