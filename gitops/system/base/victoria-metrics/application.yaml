---
# Metric storage, and the scraper that fills it. A single server, for the same
# reason victoria-logs is one.
#
# Wave 1: it claims a volume, so the storage class in wave 0 has to exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: victoria-metrics
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: victoria-metrics-single
    repoURL: https://victoriametrics.github.io/helm-charts
    targetRevision: 0.45.0
    # Inlined for the same reason as victoria-logs; see that application.yaml.
    helm:
      valuesObject:
        server:
          # Without this the chart names everything after the release and the
          # chart both, giving `victoria-metrics-victoria-metrics-single-server`.
          fullnameOverride: victoria-metrics
          # The volume keeps the chart's 16Gi default. No storageClassName:
          # local-path is the default class.
          extraArgs:
            # Metrics arriving over OpenTelemetry are named the way Prometheus
            # names them, so one dashboard query matches both sources.
            opentelemetry.usePrometheusNaming: true
          scrape:
            enabled: true
            configMap: ""
            config:
              global:
                scrape_interval: 15s
              scrape_configs:
                - job_name: victoriametrics
                  static_configs:
                    - targets: ["localhost:8428"]
                - job_name: "kubernetes-apiservers"
                  kubernetes_sd_configs:
                    - role: endpoints
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  relabel_configs:
                    - source_labels:
                        [
                          __meta_kubernetes_namespace,
                          __meta_kubernetes_service_name,
                          __meta_kubernetes_endpoint_port_name,
                        ]
                      action: keep
                      regex: default;kubernetes;https
                - job_name: "kubernetes-nodes"
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs:
                    - role: node
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                - job_name: "kubernetes-nodes-cadvisor"
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs:
                    - role: node
                  metrics_path: /metrics/cadvisor
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                    - source_labels: [__metrics_path__]
                      target_label: metrics_path
                  metric_relabel_configs:
                    - action: replace
                      source_labels: [pod]
                      regex: "(.+)"
                      target_label: pod_name
                      replacement: "${1}"
                    - action: replace
                      source_labels: [container]
                      regex: "(.+)"
                      target_label: container_name
                      replacement: "${1}"
                    - action: replace
                      target_label: name
                      replacement: k8s_stub
                    - action: replace
                      source_labels: [id]
                      regex: '^/system\.slice/(.+)\.service$'
                      target_label: systemd_service_name
                      replacement: "${1}"

                # The two jobs below are the whole of workload monitoring, and
                # they name nothing. A component is scraped because it carries
                # `prometheus.io/scrape: "true"`, which most charts already set
                # for themselves; the rest opt in with a `podAnnotations` value
                # beside their own manifest. There is no list of targets here
                # to keep in step with what is deployed.
                #
                # Two jobs rather than one, because charts disagree about where
                # the annotation goes: cert-manager, Envoy and Cilium annotate
                # the pod, while kube-dns, hubble-metrics and
                # kube-state-metrics annotate the Service.
                #
                # victoria-metrics itself is deliberately not annotated. It is
                # already scraped by the `victoriametrics` job above, and
                # annotating it too would store everything twice.
                - job_name: "kubernetes-pods"
                  kubernetes_sd_configs:
                    - role: pod
                  relabel_configs:
                    - source_labels:
                        [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                      action: keep
                      regex: "true"
                    # Discovery guesses a port from the container spec, which
                    # is rarely the metrics one. This overrides it.
                    - source_labels:
                        [__address__,
                         __meta_kubernetes_pod_annotation_prometheus_io_port]
                      action: replace
                      regex: '([^:]+)(?::\d+)?;(\d+)'
                      replacement: "${1}:${2}"
                      target_label: __address__
                    - source_labels:
                        [__meta_kubernetes_pod_annotation_prometheus_io_path]
                      action: replace
                      regex: "(.+)"
                      target_label: __metrics_path__
                    # Without these the only identity a series carries is an
                    # address, which changes every time the pod restarts.
                    - source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: pod
                    - source_labels: [__meta_kubernetes_pod_node_name]
                      target_label: node

                - job_name: "kubernetes-service-endpoints"
                  kubernetes_sd_configs:
                    - role: endpoints
                  relabel_configs:
                    - source_labels:
                        [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                      action: keep
                      regex: "true"
                    - source_labels:
                        [__address__,
                         __meta_kubernetes_service_annotation_prometheus_io_port]
                      action: replace
                      regex: '([^:]+)(?::\d+)?;(\d+)'
                      replacement: "${1}:${2}"
                      target_label: __address__
                    - source_labels:
                        [__meta_kubernetes_service_annotation_prometheus_io_path]
                      action: replace
                      regex: "(.+)"
                      target_label: __metrics_path__
                    - source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_service_name]
                      target_label: service
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: pod
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true
      # Sync the app in part when resources are changed
      # only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
