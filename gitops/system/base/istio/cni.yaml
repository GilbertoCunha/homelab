---
# Wave 2: the node agent that sets up traffic redirection inside a pod's
# network namespace when that pod joins the mesh.
#
# It chains onto Cilium's CNI configuration rather than replacing it, which is
# why `cni.exclusive: false` is set in
# gitops/system/base/cilium/cilium.yaml. Without that, Cilium deletes this
# agent's configuration on every restart and enrolled pods silently stop being
# redirected.
#
# Talos puts CNI binaries in /opt/cni/bin and configuration in /etc/cni/net.d,
# which are the chart's defaults, so `cniBinDir` and `cniConfDir` are
# deliberately not set. There is no `global.platform` value for Talos either.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    namespace: istio-system
    server: https://kubernetes.default.svc
  source:
    chart: cni
    repoURL: https://istio-release.storage.googleapis.com/charts
    targetRevision: 1.30.4
    helm:
      valuesObject:
        # Values on this chart are top level. The `values.cni.*` nesting seen
        # in Istio's documentation is IstioOperator syntax, and setting it here
        # is accepted and then ignored.
        profile: ambient
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
