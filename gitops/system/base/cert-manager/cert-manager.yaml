---
# Issues the two mesh wildcard certificates. The public path needs none:
# Cloudflare terminates TLS at the edge. See docs/concepts/ingress.md.
#
# Wave 1: nothing depends on it being up, because a Certificate is just a
# resource until cert-manager gets round to it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    tier: system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.2
    helm:
      valuesObject:
        # CRDs come from gitops/crds instead. Keep that version in step with
        # targetRevision above.
        crds:
          enabled: false
        # DNS-01 challenges are checked against the public resolvers rather
        # than the cluster's. Without this the check asks CoreDNS, which knows
        # nothing about grncunha.com, and every challenge times out.
        dns01RecursiveNameservers: 1.1.1.1:53,9.9.9.9:53
        dns01RecursiveNameserversOnly: true

        # On the system nodes; see docs/concepts/node-pools.md. The chart
        # merges the global nodeSelector into each component's, but has no
        # global tolerations, so each component names its own.
        global:
          nodeSelector:
            homelab.grncunha.com/pool: system
        tolerations:
          - key: homelab.grncunha.com/pool
            operator: Equal
            value: system
            effect: NoSchedule
        startupapicheck:
          tolerations:
            - key: homelab.grncunha.com/pool
              operator: Equal
              value: system
              effect: NoSchedule

        # Requests only, sized from `kubectl top` on 2026-09-30 with some
        # headroom: 29Mi, 19Mi and 44Mi. Without them all three were BestEffort.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        webhook:
          tolerations:
            - key: homelab.grncunha.com/pool
              operator: Equal
              value: system
              effect: NoSchedule
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        cainjector:
          tolerations:
            - key: homelab.grncunha.com/pool
              operator: Equal
              value: system
              effect: NoSchedule
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
