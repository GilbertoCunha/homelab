{{- range $env := .Values.environments }}
{{- $ns := include "project.namespace" (dict "root" $ "env" $env) }}
---
# Wave 1. Cilium runs in `default` enforcement, so a pod is unrestricted until
# some policy selects it — and this one selects everything. From here the
# namespace talks to nothing and nothing talks to it, except what the two
# policies below allow and whatever the project adds itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Nothing works without name resolution, and every project would otherwise
# write this same rule as its first act. Exempted here so the rules a project
# does write are about the project.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# VictoriaMetrics scrapes pod addresses directly, from its own namespace. The
# deny above drops that, and the failure is invisible: the workload runs, and
# simply never appears in a dashboard. See docs/concepts/observability.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoria-metrics
---
# This namespace is in the mesh, so traffic between it and another enrolled pod
# arrives on HBONE port 15008 rather than on the application's own port. The
# deny above drops all of it, and the failure looks like the network being
# broken rather than like a policy.
#
# Scoped to namespaces in the same environment, which is the one distinction
# still worth making here: it keeps dev and prod apart at the packet level, as
# docs/concepts/ingress.md says they are. Inside an environment there is
# nothing left to be narrow about, because every connection is 15008 and the
# port no longer says what the caller asked for. That specificity moves to an
# Istio AuthorizationPolicy, which names a service account rather than an
# address. See docs/concepts/istio.md.
#
# Deliberately no rule for gateway-system. A workload is exposed by writing a
# policy for it, exactly as before ambient; the only change is that the policy
# names port 15008. See docs/manual/maintenance/exposing-a-service.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              env: {{ $env.name }}
      ports:
        - protocol: TCP
          port: 15008
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              env: {{ $env.name }}
      ports:
        - protocol: TCP
          port: 15008
{{- end }}
