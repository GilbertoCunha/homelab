{{- range $env := .Values.environments }}
{{- $ns := include "project.namespace" (dict "root" $ "env" $env) }}
---
# Wave 1. Cilium runs in `default` enforcement, so a pod is unrestricted until
# some policy selects it — and this one selects everything. From here the
# namespace talks to nothing and nothing talks to it, except what the two
# policies below allow and whatever the project adds itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Nothing works without name resolution, and every project would otherwise
# write this same rule as its first act. Exempted here so the rules a project
# does write are about the project.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# VictoriaMetrics scrapes pod addresses directly, from its own namespace. The
# deny above drops that, and the failure is invisible: the workload runs, and
# simply never appears in a dashboard. See docs/concepts/observability.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoria-metrics
---
# The CloudNativePG operator reads each database pod's status on 8000 and
# connects to PostgreSQL on 5432. It runs in cnpg-system, which
# `allow-environment` below does not select, so the deny above drops it. The
# Cluster then never becomes ready, and nothing says why. CNPG labels
# every pod it creates for a database with `cnpg.io/cluster`, so a project
# writes nothing for this. Selected the same way as the API server rule in
# gitops/system/base/cnpg/api-server.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
# Lets the environment's pods talk to each other, and to the other namespaces
# of the same environment. Without it the deny above drops every connection
# between them, an API to its own database included, and the failure looks
# like the network being broken rather than like a policy.
#
# Scoped to namespaces in the same environment, which keeps dev and prod apart
# at the packet level, as docs/concepts/ingress.md says they are. Any port:
# which pod talks to which inside an environment is for a project to narrow
# with policies of its own, beside its manifests.
#
# No rule for gateway-system here: gateway-system carries no `env` label, so
# its traffic is opened separately, by `allow-gateways` below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-environment
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              env: {{ $env.name }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              env: {{ $env.name }}
---
# The Gateways live in gateway-system, which `allow-environment` above does not
# select, so without this every HTTPRoute into the namespace is
# `Accepted: True` and its backend answers 503. Opened here rather than in each
# project because every project with a route needs exactly this rule, and
# missing it looks like a broken workload rather than a policy.
#
# Only the Gateways that route to this environment, from `defaults.gateways`.
# A prod or public Gateway can never route into a dev namespace, and letting
# its packets in would undo the separation `allow-environment` draws. Any
# port: which backend and port are reachable is decided by the HTTPRoute; this
# only lets the route be answered.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateways
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "project.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: In
                values:
                  {{- toYaml (index $.Values.defaults.gateways $env.name) | nindent 18 }}
{{- end }}
