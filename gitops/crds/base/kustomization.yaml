---
# CRDs live here rather than coming from each chart, because Helm installs CRDs
# once and then never upgrades them. Keep every version in step with the chart
# that uses it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Gateway API CRDs
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml

  # ArgoCD CRDs
  - https://github.com/argoproj/argo-cd/manifests/crds?ref=v3.5.3

  # cert-manager CRDs
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.crds.yaml

  # CloudNativePG CRDs
  - https://github.com/cloudnative-pg/cloudnative-pg/config/crd?ref=v1.30.1

  # kro CRDs. The release publishes none on their own, so each is read from
  # the tag's chart.
  - https://raw.githubusercontent.com/kubernetes-sigs/kro/v0.9.4/helm/crds/kro.run_resourcegraphdefinitions.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/kro/v0.9.4/helm/crds/internal.kro.run_graphrevisions.yaml

  # sops-secrets-operator CRD, vendored
  - sops-secrets-operator
