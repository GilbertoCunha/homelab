---
name: url-shortener
environments:
  - name: dev
    quotas:
      # The API's 4-CPU limit, twice during a rollout (old and new pod at
      # once), plus Postgres (2) and Redis (1.1)
      cpu: 12
      memory: 4Gi
      storage: 20Gi
    sync:
      repo_url: https://github.com/GilbertoCunha/system-design
      revision: gitops/dev
      path: url-shortener/overlays/dev
  - name: prod
    quotas:
      # The API's 4-CPU limit, twice during a rollout (old and new pod at
      # once), plus Postgres (2) and Redis (1.1)
      cpu: 12
      memory: 4Gi
      storage: 20Gi
    sync:
      repo_url: https://github.com/GilbertoCunha/system-design
      revision: gitops/prod
      path: url-shortener/overlays/prod
