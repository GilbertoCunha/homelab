---
# A project. This file is passed to gitops/charts/project as its values, so
# what is written here is exactly what that chart reads — there is no wrapper
# and no second format.
#
# Adding a file here creates a project; deleting it destroys one, namespaces
# and volumes included. See docs/manual/maintenance/adding-a-project.md.
name: example-web-public

environments:
  # Spelled out: every optional field set, so the shape is visible.
  - name: prod
    sync:
      repo_url: https://github.com/GilbertoCunha/homelab
      revision: main
      path: examples/project-web-public
    quotas:
      cpu: "1"
      memory: 1Gi
      storage: 2Gi
      persistentvolumeclaims: "2"
    podSecurity: baseline

  # Minimal: only what is required. Everything else comes from the chart's
  # `defaults`, which is the case worth having an example of, because a list
  # entry cannot inherit those on its own.
  - name: dev
    sync:
      repo_url: https://github.com/GilbertoCunha/homelab
      revision: main
      path: examples/project-web-public
