<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 96">
  <!-- No width/height: with only a viewBox the mark scales to whatever box it
       is given, and the box is the widget's, not ours. Homepage draws this
       into a 48x48 square with object-fit: contain, so the closer the viewBox
       is to square, and the more of it the glyphs fill, the bigger the mark
       renders.

       Deliberately no textLength. It pins the mark's width whatever font the
       browser has, which is tempting given Comfortaa is unlikely to be
       installed - but it does that by stretching the tracking, so the shorter
       the word the further apart the letters march. The width below has some
       slack for that instead: too narrow and the glyphs are clipped by the
       viewBox, too wide and they shrink to sit inside it. -->
  <text
    x="100"
    y="48"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="'Comfortaa', 'Quicksand', 'Comfortaa Pro', 'Comfortaa Regular', sans-serif"
    font-size="80"
    font-weight="500"
    fill="#F8F8F8">
    grnc
  </text>
</svg>
