<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96">
  <!-- No width/height: with only a viewBox the mark scales to whatever box it
       is given, and the box is the widget's, not ours.

       The viewBox hugs the glyphs deliberately. Homepage draws this into a
       48x48 square with object-fit: contain, so every empty unit in here is
       thrown away twice over: once fitting a wide mark into a square, and
       again as blank space inside the mark.

       textLength pins the width in user units regardless of which font the
       browser actually has, so the mark keeps its proportions when Comfortaa
       is missing and it falls back. lengthAdjust=spacing changes the tracking
       only, leaving the letterforms alone. -->
  <text
    x="160"
    y="48"
    dominant-baseline="central"
    text-anchor="middle"
    textLength="304"
    lengthAdjust="spacing"
    font-family="'Comfortaa', 'Quicksand', 'Comfortaa Pro', 'Comfortaa Regular', sans-serif"
    font-size="80"
    font-weight="500"
    fill="#F8F8F8">
    grnc
  </text>
</svg>
