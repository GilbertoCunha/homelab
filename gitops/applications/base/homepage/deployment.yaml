---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      # Discovery reads the API server, so it must not run as the default
      # service account, which can read nothing.
      automountServiceAccountToken: true
      # Run init container to make config dir writeable
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp -a /config-source/. /config/
          volumeMounts:
            - name: homepage-config
              mountPath: /config-source
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.1.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Homepage refuses requests for a Host it was not told about. The
            # pod address is what the liveness probe asks for, so leaving it
            # out fails the probe and the pod never becomes ready; the hostname
            # is what a browser asks for.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: $(MY_POD_IP):3000,home.k8s.homelab.grncunha.com
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /app/config
              name: config
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
