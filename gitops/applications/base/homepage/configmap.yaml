---
# Homepage reads a directory of YAML files. Every file it expects has to be a
# key here, because the mount replaces the whole directory: a missing one is
# read as empty rather than defaulted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab

    # Fixed dark, rather than following the browser. The background sits on top
    # of the theme's own colour, so a light theme would wash it out and leave
    # the same unreadable text this is here to avoid.
    theme: dark

    # Puts each header widget in its own card, so the greeting, the clock and
    # the cluster gauges match the service tiles below instead of floating as
    # bare text. `underlined` is the default; `clean` removes even the rule.
    headerStyle: boxedWidgets

    # Fetched by the browser, not the pod, so it needs the viewer to have
    # internet — the same as the tile icons. It must be a direct link to the
    # image itself: an imgur.com/gallery/... page is HTML, and CSS given HTML
    # draws nothing.
    #
    # `opacity` is what makes the text readable: it fades the image toward the
    # dark theme colour underneath. Lower is darker — turn it down if the text
    # is still hard to read, up if the image is washing out.
    #
    # It is deliberately not `brightness`, which would do the same job but is
    # documented as incompatible with `cardBlur` below.
    background:
      image: https://i.imgur.com/IzrpX9X.jpeg
      # opacity: 30
      blur: lg

    useEqualHeights: true
    # Order here is the order groups appear in.
    layout:
      # `style: row` is the only thing that makes a group full width, and it
      # also puts the services on one line — the two are the same switch. One
      # column, so the two services read as two rows across the top.
      Host:
        style: row
        columns: 1
      # Default style: the services stack, and the groups sit beside each other
      # rather than each taking a full-width band. Homepage sizes these by
      # breakpoint — half the width at md, a third at lg, a quarter at xl — so
      # they get narrower on a wide display. There is no setting for the width;
      # changing it means CSS.
      Cluster:
        style: column
      Observability:
        style: column

  kubernetes.yaml: |
    mode: cluster
    # Read HTTPRoutes, not just Ingresses. Without this the cluster is scanned
    # for Ingress objects, of which there are none here, and the page comes up
    # with only the static entries below.
    gateway: true

  services.yaml: |
    # Only what has no HTTPRoute to annotate. Everything inside the cluster
    # declares itself on its own route; these two run on the host, served by
    # Caddy, and nothing in the cluster knows they exist.
    - Host:
        - Proxmox:
            href: https://proxmox.homelab.grncunha.com
            description: Virtual machines, storage and consoles
            icon: proxmox.png
        - Headscale:
            href: https://vpn.homelab.grncunha.com
            description: The mesh itself, where devices join
            icon: headscale.png

  widgets.yaml: |
    # The wordmark from logo.svg, mounted into /app/public/icons by the
    # Deployment and served at the path below.
    - logo:
        icon: /icons/logo.svg
    # Reads the metrics API, which is why metrics-server exists. Empty tiles
    # here mean it is not answering: check `kubectl top nodes`.
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  bookmarks.yaml: |
    - Repo:
        - homelab:
            - href: https://github.com/GilbertoCunha/homelab
              icon: github.png
