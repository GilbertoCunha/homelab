# The Cloudflare DNS API token, encrypted, and committed. sops-secrets-operator
# decrypts it in the cluster and writes a Secret named cloudflare-api-dns-token
# into the cert-manager namespace.
#
# One file per namespace, because a Secret is only readable in its own: a
# ClusterIssuer resolves its secret ref from cert-manager's namespace, and the
# external-dns pod mounts it from its own.
#
# Edit it with:
#   task secrets:edit:cluster -- gitops/secrets/base/cloudflare-cert-manager.sops.yaml
#
# Scope the token to Zone - DNS - Edit on grncunha.com and nothing else. The
# tunnel needs an account-scoped token instead, which is a second one; see
# docs/backlog.md.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: cloudflare-api-dns-token
    namespace: cert-manager
spec:
    secretTemplates:
        - name: ENC[AES256_GCM,data:KO66BGpYsPLHk+eh4n+F4C0t8XWqm10O,iv:vrE/x6TqlNvsOmax+3yS1oXqdnYeidQojVdgDiU8/HU=,tag:cKAZhdywQ5lFaayhhZnokg==,type:str]
