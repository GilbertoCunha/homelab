# The Cloudflare API token, encrypted, and committed. sops-secrets-operator
# decrypts it in the cluster and writes a Secret named cloudflare-api-token
# into the external-dns namespace.
#
# One file per namespace, because a Secret is only readable in its own: a
# ClusterIssuer resolves its secret ref from cert-manager's namespace, and the
# external-dns pod mounts it from its own.
#
# Edit it with:
#   task secrets:edit:cluster -- gitops/secrets/base/cloudflare-external-dns.sops.yaml
#
# Scope the token to Zone - DNS - Edit on grncunha.com and nothing else.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: cloudflare-api-token
    namespace: external-dns
spec:
    secretTemplates:
