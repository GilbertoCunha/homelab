---
proxmox_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
proxmox_key_url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
proxmox_repo_url: http://download.proxmox.com/debian/pve
proxmox_suite: trixie

# The Proxmox VE version the server runs: the version of its `pve-manager`
# package. A record, not an instruction. Proxmox is upgraded by hand and
# nothing installs this version. It is here so Renovate has something to
# compare with the repository above, and opens a pull request when a newer
# one is out. Set it after upgrading; the role says so when it has drifted.
# See docs/manual/maintenance/updating-a-component.md.
proxmox_version: "9.2.21"

proxmox_packages:
  - proxmox-ve
  - postfix
  - open-iscsi

# Removed after Proxmox supplies its own kernel and boot menu.
proxmox_obsolete_packages:
  - linux-image-amd64
  - os-prober

# Ships enabled but needs a paid subscription, so every apt update fails on it.
proxmox_enterprise_repo_files:
  - /etc/apt/sources.list.d/pve-enterprise.sources
  - /etc/apt/sources.list.d/ceph.sources

# The only storage on the server: the implicit `local` directory, backed by the
# root filesystem. Proxmox already allows these by default; they are listed so
# the cluster's requirements are recorded, and stay true if the defaults change.
# The role adds them to whatever is already set rather than replacing it.
proxmox_storage: local
proxmox_storage_content:
  - images     # guest disks
  - iso        # the Talos boot image
  - snippets   # cloud-init data, if the generated drive is ever not enough

# The host threads guests may run on. The i7-8700 pairs thread N with thread
# N+6 on one core, so this leaves core 0, threads 0 and 6, to the server: the
# mesh client, the guest bridge and Proxmox itself. Guests that fill every
# thread leave those waiting behind them. See docs/concepts/node-pools.md.
proxmox_guest_cpus: 1-5,7-11

# OpenTofu reaches the API as this user, never as root. See
# docs/manual/3-provision-cluster.md for minting the token.
proxmox_api_user: opentofu@pve
proxmox_api_role: OpenTofu
proxmox_api_token_name: tofu

# The smallest set that still lets the provider build, configure and destroy
# guests, and pull the Talos image into the guest storage.
proxmox_api_privileges:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - SDN.Use
  - Sys.Audit
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.PowerMgmt
