---
# Runs even under --check. Downloading the package index changes no system
# state, and a fresh server has no index at all, so without this a check run
# cannot resolve a single package name.
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  check_mode: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

# Proxmox refuses to install unless the hostname resolves to the server's real
# address. Debian ships 127.0.1.1, which is not good enough.
- name: Resolve the hostname to the real address in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ server_fqdn | regex_escape }}\b|^127\.0\.1\.1\s'
    line: "{{ ansible_facts.default_ipv4.address }} {{ server_fqdn }} {{ server_hostname }}"
    owner: root
    group: root
    mode: "0644"

- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    validate: /usr/sbin/sshd -T -f %s
  loop: "{{ common_sshd_settings | dict2items }}"
  notify: Restart sshd

- name: Enable IPv4 forwarding for Proxmox guests
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Install the firewall ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload nftables

- name: Enable the firewall
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started

# Left in list-only mode so it never restarts a service or prompts during an
# apt run. The reboot role decides what to do about what it reports.
- name: Keep needrestart from acting on its own
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/common). Do not edit on the server.
      # This file is Perl, so comments use '#'.
      $nrconf{restart} = 'l';
    dest: /etc/needrestart/conf.d/99-ansible.conf
    owner: root
    group: root
    mode: "0644"
    validate: perl -c %s

- name: Schedule unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Enable unattended upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
