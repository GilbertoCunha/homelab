---
common_packages:
  - ca-certificates
  - curl
  - gnupg
  - htop
  - needrestart
  - nftables
  - unattended-upgrades
  - vim

# UDP ports the mesh needs on the public interface.
common_derp_stun_port: 3478      # headscale embedded DERP, for NAT traversal
common_wireguard_port: 41641     # tailscale data plane

# Installing unattended-upgrades is not enough. The apt-daily timers only act
# when these are set, and Debian ships no such file, so nothing is applied.
# 1 means daily. An allow list of origins decides what is eligible, and it
# starts as Debian's own repositories only. The caddy and mesh_node roles each
# add theirs. Nothing adds the Proxmox repository, so PVE is never
# auto-upgraded.
common_apt_periodic:
  Update-Package-Lists: 1
  Unattended-Upgrade: 1
  AutocleanInterval: 7

# Kernel settings this role makes permanent. Under /etc/sysctl.d because that
# is the directory read at boot; /etc/sysctl.conf is not, on Debian 13.
common_sysctl_file: /etc/sysctl.d/90-homelab.conf

common_sshd_settings:
  PasswordAuthentication: "no"
  PermitRootLogin: prohibit-password
  KbdInteractiveAuthentication: "no"
