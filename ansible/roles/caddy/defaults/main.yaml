---
caddy_keyring: /usr/share/keyrings/caddy-stable.gpg
caddy_key_url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
caddy_repo_url: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
# What the repository above calls itself: the `o=` field of
# `apt-cache policy`. Unattended upgrades match packages by it.
caddy_apt_origin: cloudsmith/caddy/stable
caddy_apt_origin_path: /etc/apt/apt.conf.d/52unattended-upgrades-caddy
