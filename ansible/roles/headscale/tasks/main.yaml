---
- name: Check which headscale version is installed
  ansible.builtin.command: dpkg-query -W -f='${Version}' headscale
  register: headscale_installed
  changed_when: false
  failed_when: false

# Skipped entirely once the wanted version is installed, so a cleared cache
# does not cause a needless 20MB download.
- name: Install headscale
  when: headscale_installed.stdout != headscale_version
  block:
    - name: Create the package cache directory
      ansible.builtin.file:
        path: "{{ headscale_cache_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the headscale package
      ansible.builtin.get_url:
        url: "{{ headscale_deb_url }}"
        dest: "{{ headscale_deb_path }}"
        checksum: "sha256:{{ headscale_deb_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the headscale package
      ansible.builtin.apt:
        deb: "{{ headscale_deb_path }}"
        state: present

# The keys under {{ headscale_data_dir }} are generated by headscale on first
# start. Never template them: rewriting a key de-registers every node.
- name: Install the headscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ headscale_config_dir }}/config.yaml"
    owner: root
    group: headscale
    mode: "0640"
  notify: Restart headscale

- name: Install the access policy
  ansible.builtin.template:
    src: acl.hujson.j2
    dest: "{{ headscale_policy_path }}"
    owner: root
    group: headscale
    mode: "0640"
  notify: Restart headscale

# Created empty so headscale has something to watch on a first start. The
# mesh_node role fills it in once this host has a mesh address.
- name: Create the extra DNS records file
  ansible.builtin.copy:
    content: "[]\n"
    dest: "{{ headscale_records_path }}"
    owner: root
    group: headscale
    mode: "0640"
    force: false

- name: Publish headscale through Caddy
  ansible.builtin.template:
    src: headscale.caddy.j2
    dest: "{{ caddy_sites_dir }}/headscale.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

- name: Enable headscale
  ansible.builtin.service:
    name: headscale
    enabled: true
    state: started

- name: Apply pending restarts before the policy is checked
  ansible.builtin.meta: flush_handlers

- name: Check that the access policy is valid
  ansible.builtin.command: headscale policy check --file {{ headscale_policy_path }}
  changed_when: false
