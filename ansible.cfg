[defaults]
inventory = ansible/inventory.yaml
roles_path = ansible/roles
remote_user = root
host_key_checking = True
interpreter_python = auto_silent
# Facts are read as ansible_facts.<name>, never as top-level ansible_<name>.
# The old injection is deprecated and goes away in ansible-core 2.24.
inject_facts_as_vars = False
# The community.general.yaml callback was removed in community.general 12.
# The built-in default callback does the same thing with this option.
callback_result_format = yaml
display_skipped_hosts = False

[ssh_connection]
pipelining = True
