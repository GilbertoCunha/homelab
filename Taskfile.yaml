---
version: "3"

vars:
  # The tofu tasks run inside the root module, so the secrets file is named by
  # absolute path rather than relative to the working directory.
  TOFU_DIR: opentofu/project
  # The kustomize overlays ArgoCD syncs. `cluster:bootstrap` applies the same
  # ones, which is what lets ArgoCD adopt what it finds already running.
  GITOPS_DIR: gitops
  KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubeconfig'
  SECRETS: '{{.ROOT_DIR}}/secrets.enc.yaml'
  SOPS_CONFIG: '{{.ROOT_DIR}}/.sops.yaml'
  AGE_KEY: '{{.HOME}}/.config/sops/age/keys.txt'
  # Decrypts to the environment for the life of one command. Nothing is written
  # to disk in the clear, so there is no plaintext file to forget about.
  WITH_SECRETS: sops exec-env {{.SECRETS}}

env:
  # SOPS looks for the age key in a different place on every platform, and on
  # macOS it is `~/Library/Application Support/sops/age/keys.txt`. Naming the
  # file outright means the key lives in one place whatever the machine.
  SOPS_AGE_KEY_FILE: '{{.AGE_KEY}}'

tasks:
  ansible:deps:
    desc: Installs the Ansible collections the playbook needs
    cmds:
      - ansible-galaxy collection install -r ansible/requirements.yaml

  ansible:ping:
    desc: Pings the inventory to ensure the server is up
    cmds:
      - ansible servers -m ping

  ansible:lint:
    desc: Lints the Ansible codebase
    cmds:
      - ansible-lint ansible/

  ansible:site:
    desc: Configures the server
    cmds:
      - ansible-playbook ansible/site.yaml

  ansible:role:
    desc: Configures a single role, e.g. `task ansible:role -- headscale`
    cmds:
      - ansible-playbook ansible/site.yaml --tags {{.CLI_ARGS}} --diff

  ansible:site:no-mesh:
    desc: Configures the server, skipping the roles that need a TLS certificate
    cmds:
      - ansible-playbook ansible/site.yaml --skip-tags mesh

  secrets:init:
    desc: Creates the age key, .sops.yaml and the encrypted secrets file. Once, ever
    cmds:
      - |
        set -eu
        if [ -f "{{.AGE_KEY}}" ]; then
          echo "Using the age key already at {{.AGE_KEY}}"
        else
          mkdir -p "$(dirname "{{.AGE_KEY}}")"
          age-keygen -o "{{.AGE_KEY}}"
          echo "Back this file up outside the repo. Nothing here decrypts without it."
        fi

        # Written from the key itself, so there is no placeholder to forget.
        recipient="$(age-keygen -y "{{.AGE_KEY}}")"
        cat > "{{.SOPS_CONFIG}}" <<EOF
        # Managed by \`task secrets:init\`. Names the key that may decrypt each file.
        # The recipient is a public key: safe to commit, useless on its own.
        creation_rules:
          - path_regex: secrets\.enc\.yaml$
            age: $recipient
        EOF
        echo "Wrote {{.SOPS_CONFIG}} for $recipient"

        if [ -f "{{.SECRETS}}" ]; then
          echo "{{.SECRETS}} already exists, leaving it alone."
        else
          # The key names are the file's own documentation: SOPS encrypts values
          # only, so these stay readable without decrypting anything.
          cat > "{{.SECRETS}}" <<'EOF'
        PROXMOX_ROOT_PASSWORD: ""
        PROXMOX_VE_API_TOKEN: ""
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
        CLOUDFLARE_API_TOKEN: ""
        EOF
          sops -e -i "{{.SECRETS}}"
          echo "Created {{.SECRETS}}, encrypted and empty. Fill it with: task secrets:edit"
        fi

  secrets:edit:
    desc: Opens the encrypted secrets file in your editor
    cmds:
      - sops {{.SECRETS}}

  secrets:check:
    desc: Fails if the secrets file is not encrypted. Run before committing
    cmds:
      - |
        set -eu
        if [ ! -f "{{.SECRETS}}" ]; then
          echo "No {{.SECRETS}}. Run: task secrets:init"
          exit 1
        fi
        if ! grep -q '^sops:' "{{.SECRETS}}"; then
          echo "REFUSING: {{.SECRETS}} is PLAINTEXT and is not gitignored."
          echo "Encrypt it before committing:  sops -e -i {{.SECRETS}}"
          exit 1
        fi
        echo "{{.SECRETS}} is encrypted."

  secrets:show:
    desc: Prints the decrypted secrets, to check the age key works
    cmds:
      - sops -d {{.SECRETS}}

  tofu:init:
    desc: Initialises OpenTofu against the R2 state backend
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu init {{.CLI_ARGS}}"'

  tofu:fmt:
    desc: Formats the OpenTofu code
    cmds:
      - tofu fmt -recursive opentofu/

  tofu:validate:
    desc: Checks the OpenTofu code is valid, without reaching the server
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu validate"'

  tofu:plan:
    desc: Shows what OpenTofu would change
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu plan {{.CLI_ARGS}}"'

  tofu:apply:
    desc: Builds the cluster, and waits for it to report healthy
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu apply {{.CLI_ARGS}}"'

  tofu:destroy:
    desc: Removes every guest. The cluster and its volumes are gone afterwards
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu destroy {{.CLI_ARGS}}"'

  tofu:unlock:
    desc: Releases a stale state lock, e.g. `task tofu:unlock -- <lock id>`
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu force-unlock {{.CLI_ARGS}}"'

  tofu:cilium-manifest:
    desc: Writes ./cilium.yaml, the rendered CNI manifest, for applying by hand
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu output -raw cilium_manifest" > {{.ROOT_DIR}}/cilium.yaml'
      - 'echo "Wrote cilium.yaml. Normally Talos applies this for you; see docs/manual/maintenance/upgrading-cilium.md"'

  tofu:kubeconfig:
    desc: Writes ./kubeconfig, for kubectl
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu output -raw kubeconfig" > {{.KUBECONFIG_FILE}}'
      - chmod 600 {{.KUBECONFIG_FILE}}
      - 'echo "Wrote kubeconfig. Use it with: export KUBECONFIG={{.KUBECONFIG_FILE}}"'

  tofu:talosconfig:
    desc: Writes ./talosconfig, for talosctl
    dir: "{{.TOFU_DIR}}"
    cmds:
      - '{{.WITH_SECRETS}} "tofu output -raw talosconfig" > {{.ROOT_DIR}}/talosconfig'
      - chmod 600 {{.ROOT_DIR}}/talosconfig
      - 'echo "Wrote talosconfig. Use it with: export TALOSCONFIG={{.ROOT_DIR}}/talosconfig"'

  cluster:render:
    desc: Renders the GitOps overlays without a cluster. Run before committing
    cmds:
      - kustomize build --enable-helm {{.GITOPS_DIR}}/crds/overlays/production > /dev/null
      - kustomize build --enable-helm {{.GITOPS_DIR}}/system/overlays/production > /dev/null
      - 'echo "Both overlays render."'

  cluster:diff:
    desc: Shows what `task cluster:bootstrap` would change
    env:
      KUBECONFIG: '{{.KUBECONFIG_FILE}}'
    cmds:
      # `kubectl diff` exits 1 when it finds a difference. That is not a
      # failure here, so the exit code is discarded and only the diff matters.
      - |
        kustomize build --enable-helm {{.GITOPS_DIR}}/crds/overlays/production \
          | kubectl diff --server-side --force-conflicts -f - || true
      - |
        kustomize build --enable-helm {{.GITOPS_DIR}}/system/overlays/production \
          | kubectl diff --server-side --force-conflicts -f - || true

  cluster:bootstrap:
    desc: Applies the GitOps overlays once, so ArgoCD can take over from git
    env:
      KUBECONFIG: '{{.KUBECONFIG_FILE}}'
    cmds:
      # CRDs go first and separately. The system overlay creates Applications,
      # a kind the API server does not know until this apply is accepted.
      - |
        kustomize build --enable-helm {{.GITOPS_DIR}}/crds/overlays/production \
          | kubectl apply --server-side --force-conflicts -f -
      - kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=60s
      # --force-conflicts because on every run after the first the fields belong
      # to ArgoCD's field manager rather than kubectl's. Applying the manifests
      # ArgoCD itself syncs is the point: this task is repeatable, not one-shot.
      - |
        kustomize build --enable-helm {{.GITOPS_DIR}}/system/overlays/production \
          | kubectl apply --server-side --force-conflicts -f -
      - 'echo "Bootstrapped. Check it with: kubectl -n argocd get applications"'

  cluster:cloudflare-token:
    desc: Creates the Cloudflare API token Secret, which cannot come from git
    env:
      KUBECONFIG: '{{.KUBECONFIG_FILE}}'
    cmds:
      # cert-manager and external-dns both read this, and a ClusterIssuer
      # resolves its secret from cert-manager's own namespace, so there are two
      # copies of one value. Piping through `apply` rather than `create` keeps
      # the task repeatable.
      - |
        {{.WITH_SECRETS}} 'set -eu
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
          echo "CLOUDFLARE_API_TOKEN is empty or missing from the secrets file."
          echo "Add it with: task secrets:edit"
          exit 1
        fi
        for ns in cert-manager external-dns; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$ns" create secret generic cloudflare-api-token \
            --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
        done'
      - 'echo "Token in place. ArgoCD owns everything that reads it."'
