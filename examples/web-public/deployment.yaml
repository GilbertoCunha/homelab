---
# traefik/whoami echoes the request back as plain text, including the Host
# header it received. That is the thing worth seeing: cloudflared must pass the
# original host through, or gw-public matches no route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: web-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
