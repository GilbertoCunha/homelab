---
# No annotations, deliberately. Attaching to gw-public is what makes the record
# a proxied CNAME through the tunnel: external-dns-tunnel is the only instance
# watching that Gateway, and it proxies everything it writes. A
# cloudflare-proxied annotation here would do nothing, and one on the Gateway
# does nothing either. See docs/concepts/ingress.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: web-public
spec:
  parentRefs:
    - name: gw-public
      namespace: gateway-system
      sectionName: http
  hostnames:
    - whoami.grncunha.com
  rules:
    - backendRefs:
        - name: whoami
          port: 80
