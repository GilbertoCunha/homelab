---
# No namespace. That is the whole difference from `web-public/` next door: a
# project's Application deploys this into the namespace the project owns, and a
# manifest naming its own would be refused as outside the project's
# destinations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          # Port 8080, not the image's default of 80. Binding below 1024 needs
          # a capability this pod does not have, and `restricted` — the Pod
          # Security level a project namespace defaults to — does not grant it.
          #
          # Set by environment rather than by the `port` flag, which takes a
          # bare number and is easy to pass in a form that silently does not
          # parse.
          env:
            - name: WHOAMI_PORT_NUMBER
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          # A project's ResourceQuota names requests and limits for both cpu
          # and memory, and the API server then refuses any pod that leaves one
          # of the four out. There is no LimitRange to fill them in.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          # Enough to satisfy `restricted`, which is what a project namespace
          # enforces unless its catalog entry says otherwise.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
